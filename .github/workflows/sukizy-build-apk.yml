name: Build APK (SUKIZY)
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Nama aplikasi
        default: App
      app_id:
        description: Package ID
        default: com.sukizy.app
      web_url:
        description: URL website (opsional, bungkus website online jadi APK)
        default: ''
      permissions:
        description: Izin aplikasi Android (dipisah koma)
        default: INTERNET,ACCESS_NETWORK_STATE
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan project web
        shell: bash
        env:
          WEB_URL: ${{ inputs.web_url }}
        run: |
          {
            W="$RUNNER_TEMP/apk"
            mkdir -p "$W/www"
            if [ -n "$WEB_URL" ]; then
              echo "Mode bungkus website: $WEB_URL"
              printf '<!doctype html><meta charset="utf-8"><title>Memuat</title><p>Memuat...</p>' > "$W/www/index.html"
            else
              rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' ./ "$W/www/"
              test -f "$W/www/index.html" || { echo "ERROR: index.html tidak ditemukan di root repo"; exit 1; }
              echo "File web siap: $(find "$W/www" -type f | wc -l) file"
            fi
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Pasang Capacitor Android
        shell: bash
        working-directory: ${{ runner.temp }}/apk
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_ID: ${{ inputs.app_id }}
          WEB_URL: ${{ inputs.web_url }}
        run: |
          {
            npm init -y
            npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --no-fund --no-audit
            npx cap init "$APP_NAME" "$APP_ID" --web-dir www
            if [ -n "$WEB_URL" ]; then
              node -e 'const fs=require("fs");const f="capacitor.config.json";if(!fs.existsSync(f)){console.error("ERROR: capacitor.config.json tidak ditemukan");process.exit(1)}const c=JSON.parse(fs.readFileSync(f,"utf8"));const u=process.env.WEB_URL;c.server={url:u,cleartext:/^http:/.test(u),androidScheme:"https"};fs.writeFileSync(f,JSON.stringify(c,null,2));console.log("server.url diatur ke "+u)'
            fi
            npx cap add android
            npx cap sync android
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Atur izin aplikasi
        shell: bash
        working-directory: ${{ runner.temp }}/apk
        env:
          PERMS: ${{ inputs.permissions }}
        run: |
          {
            M=android/app/src/main/AndroidManifest.xml
            test -f "$M" || { echo "ERROR: AndroidManifest.xml tidak ditemukan"; exit 1; }
            for P in $(echo "$PERMS" | tr ',' ' '); do
              case "$P" in *[!A-Z0-9_]*) continue;; esac
              grep -q "android.permission.$P\"" "$M" || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$M"
              echo "Izin aplikasi: $P"
            done
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Build APK
        shell: bash
        working-directory: ${{ runner.temp }}/apk/android
        run: |
          {
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --console=plain
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"
      - name: Publikasikan ke Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" "$RUNNER_TEMP/apk/android/app/build/outputs/apk/debug/app-debug.apk#app-debug.apk" --repo "$GITHUB_REPOSITORY" --title "APK #${{ github.run_number }}" --notes "Dibuat oleh SUKIZY dari commit ${GITHUB_SHA::7}"
      - name: Simpan log build
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || exit 0
          cp "$LOG" "$RUNNER_TEMP/build-${{ github.run_number }}.log"
          gh release view sukizy-logs --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create sukizy-logs --repo "$GITHUB_REPOSITORY" --prerelease --title "Log build SUKIZY" --notes "Log build APK (otomatis)"
          gh release upload sukizy-logs "$RUNNER_TEMP/build-${{ github.run_number }}.log" --repo "$GITHUB_REPOSITORY" --clobber
